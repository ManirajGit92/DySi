<div class="change-password-page">
  <div class="password-card">
    <div class="card-icon-header">
      <div class="lock-icon-circle">
        <i class="fa-solid fa-lock"></i>
      </div>
    </div>

    <div class="card-title-header text-center">
      <h1>Change Password</h1>
      <p>Update your account password to keep your account secure.</p>
    </div>

    @if (successMessage()) {
      <div class="alert alert--success">
        <i class="fa-solid fa-circle-check"></i>
        <span>{{ successMessage() }}</span>
      </div>
    }

    @if (errorMessage()) {
      <div class="alert alert--danger">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="password-form">
      <div class="form-group">
        <label>Current Password <span class="req">*</span></label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            [type]="showCurrentPassword() ? 'text' : 'password'"
            formControlName="currentPassword"
            placeholder="Enter your current password"
          />
          <button type="button" class="eye-btn" (click)="showCurrentPassword.set(!showCurrentPassword())">
            <i class="fa-regular" [class.fa-eye]="!showCurrentPassword()" [class.fa-eye-slash]="showCurrentPassword()"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>New Password <span class="req">*</span></label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            [type]="showNewPassword() ? 'text' : 'password'"
            formControlName="newPassword"
            placeholder="Enter your new password"
          />
          <button type="button" class="eye-btn" (click)="showNewPassword.set(!showNewPassword())">
            <i class="fa-regular" [class.fa-eye]="!showNewPassword()" [class.fa-eye-slash]="showNewPassword()"></i>
          </button>
        </div>

        <!-- Requirements checklist card -->
        <div class="requirements-box">
          <div class="req-item" [class.valid]="isAtLeast6Chars">
            <div class="check-icon">
              <i class="fa-solid" [class.fa-check]="isAtLeast6Chars" [class.fa-minus]="!isAtLeast6Chars"></i>
            </div>
            <span>At least 6 characters long</span>
          </div>

          <div class="req-item" [class.valid]="hasLettersAndNumbers">
            <div class="check-icon">
              <i class="fa-solid" [class.fa-check]="hasLettersAndNumbers" [class.fa-minus]="!hasLettersAndNumbers"></i>
            </div>
            <span>Should include letters and numbers</span>
          </div>

          <div class="req-item" [class.valid]="isDifferentFromCurrent">
            <div class="check-icon">
              <i class="fa-solid" [class.fa-check]="isDifferentFromCurrent" [class.fa-minus]="!isDifferentFromCurrent"></i>
            </div>
            <span>Should be different from your current password</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm New Password <span class="req">*</span></label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            [type]="showConfirmPassword() ? 'text' : 'password'"
            formControlName="confirmNewPassword"
            placeholder="Confirm your new password"
          />
          <button type="button" class="eye-btn" (click)="showConfirmPassword.set(!showConfirmPassword())">
            <i class="fa-regular" [class.fa-eye]="!showConfirmPassword()" [class.fa-eye-slash]="showConfirmPassword()"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn--gradient btn--full" [disabled]="isLoading()">
        @if (isLoading()) {
          <i class="fa-solid fa-spinner fa-spin"></i> Updating Password...
        } @else {
          Update Password
        }
      </button>

      <button type="button" class="btn btn--cancel" (click)="cancel()">
        Cancel
      </button>
    </form>
  </div>
</div>
