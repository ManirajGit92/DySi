<div class="forgot-password-page">
  <div class="forgot-card">
    <div class="card-icon-header">
      <div class="key-icon-circle">
        <i class="fa-solid fa-key"></i>
      </div>
    </div>

    <div class="card-title-header text-center">
      <h1>Forgot Password?</h1>
      <p>Enter your email address and we'll send you a link to reset your password.</p>
    </div>

    @if (successMessage()) {
      <div class="alert alert--success">
        <i class="fa-solid fa-circle-check"></i>
        <span>{{ successMessage() }}</span>
      </div>
    }

    @if (errorMessage()) {
      <div class="alert alert--danger">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="forgot-form">
      <div class="form-group">
        <label>Email Address <span class="req">*</span></label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input
            type="email"
            formControlName="email"
            placeholder="Enter your account email"
          />
        </div>
      </div>

      <button type="submit" class="btn btn--gradient btn--full" [disabled]="isLoading()">
        @if (isLoading()) {
          <i class="fa-solid fa-spinner fa-spin"></i> Sending Reset Link...
        } @else {
          Send Reset Link
        }
      </button>

      <div class="back-to-login text-center">
        <a routerLink="/admin" class="login-link">
          <i class="fa-solid fa-arrow-left"></i> Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
